<!doctype html>
<meta charset="utf-8">
<title>PMX 見比べ</title>
<style>
  html, body { margin: 0; height: 100%; background: #e9e6ef; font: 13px sans-serif; }
  .row { display: flex; height: 100%; }
  .col { flex: 1; display: flex; flex-direction: column; border-left: 1px solid #bbb; }
  .col:first-child { border-left: 0; }
  .cap { padding: 4px 8px; background: #fff; }
  iframe { flex: 1; border: 0; }
</style>
<div class="row" id="row"></div>
<script>
// 2 つ（以上）のモデルを同じ角度で並べる：compare.html?m=tabane_roze_scan,tabane_roze_sculpt&cam=face&yaw=40
// m 以外のパラメータはそのまま index.html に渡す
const Q = new URLSearchParams(location.search);
const keys = (Q.get("m") || "tabane_roze_scan,tabane_roze_sculpt").split(",");
Q.delete("m");
if (!Q.has("ui")) Q.set("ui", "0");
for (const k of keys) {
  const col = document.createElement("div");
  col.className = "col";
  col.innerHTML = `<div class="cap">${k}</div><iframe src="index.html?m=${encodeURIComponent(k)}&${Q}"></iframe>`;
  document.getElementById("row").appendChild(col);
}
</script>
