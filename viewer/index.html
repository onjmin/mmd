<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMX ビューア</title>
<style>
  body { margin: 0; background: #e9e6ef; font: 13px system-ui, sans-serif; overflow: hidden; }
  #ui { position: fixed; top: 8px; left: 8px; background: #fffd; padding: 8px 10px; border-radius: 8px; max-width: 260px; }
  #ui label { display: block; margin: 2px 0; }
  #ui input[type=range] { width: 120px; vertical-align: middle; }
  button { margin: 2px 2px 2px 0; }
  /* 比較モード：左に立ち絵、右にモデル */
  #ref { display: none; position: fixed; left: 0; top: 0; width: 50vw; height: 100vh; background: #e9e6ef no-repeat center / contain; }
  body.compare #ref { display: block; }
  body.compare #ui { display: none; }
  body.compare canvas { position: fixed; left: 50vw; top: 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/"
} }
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/libs/ammo.wasm.js"></script>
</head>
<body>
<div id="ref"></div>
<div id="ui">
  <div>
    <button data-model="tabane_roze">ロゼ</button>
    <button data-model="chikune_kiriko">キリコ</button>
    <button data-model="feris">フェリス</button>
  </div>
  <div>
    <button id="pose">ポーズ確認</button>
  </div>
  <div>
    <button data-motion="walk">歩く</button>
    <button data-motion="run">走る</button>
    <button data-motion="jump">ジャンプ</button>
    <button data-motion="dance">ダンス</button>
    <button data-motion="">止める</button>
    <label>速さ <input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="1"></label>
  </div>
  <div>
    <button id="front">正面</button>
    <button id="side">横</button>
    <button id="back">後ろ</button>
    <button id="face">顔</button>
    <label><input type="checkbox" id="physics" checked> 物理</label>
    <label><input type="checkbox" id="outline" checked> 輪郭線 <input type="range" id="outlineWidth" min="0.5" max="5" step="0.1" value="1.8"></label>
  </div>
  <div id="morphs"></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { MMDLoader } from "three/addons/loaders/MMDLoader.js";
import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";
import { MMDPhysics } from "three/addons/animation/MMDPhysics.js";

const ammoReady = Ammo().then((A) => { window.Ammo = A; });

// 比較モード: ?m=キー&ref=1（全身）または &ref=face&fb=x0,y0,x1,y1（立ち絵の顔の範囲を 0〜1 で）。
// img=ファイル名 で ref/ の別の絵と並べる（既定は キー.png）
const Q = new URLSearchParams(location.search);
const compare = Q.get("ref");
if (compare) document.body.classList.add("compare");
const W = () => (compare ? innerWidth / 2 : innerWidth);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(W(), innerHeight);
document.body.appendChild(renderer.domElement);
const effect = new OutlineEffect(renderer);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9e6ef);
// MMD の既定照明（光源 0.6、環境色は材質側）に寄せる
scene.add(new THREE.AmbientLight(0x000000));
const LIGHT = 0x99 / 255;
const light = new THREE.DirectionalLight(0x999999);
light.position.set(-0.5, 1, 1);
scene.add(light);
const camera = new THREE.PerspectiveCamera(30, W() / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
window.camera = camera;  // コンソールから調べる用
let mesh = null, physics = null, posing = false, t = 0;
if (Q.get("outline") !== null) document.getElementById("outline").checked = Q.get("outline") !== "0";
if (Q.get("edge") !== null) document.getElementById("outlineWidth").value = Q.get("edge");

function updateOutline() {
  if (!mesh) return;
  const on = document.getElementById("outline").checked;
  const w = +document.getElementById("outlineWidth").value;
  mesh.material.forEach((mt) => {
    const p = mt.userData.outlineParameters;
    if (!p) return;
    if (p.baseVisible === undefined) p.baseVisible = p.visible;
    p.visible = on && p.baseVisible;
    // 線の色と太さはモデルの材質の値を使う（太さはスライダーで全体を掛ける。3.3 が等倍）
    if (p.baseThickness === undefined) p.baseThickness = p.thickness;
    p.thickness = p.baseThickness * w / 3.3;
  });
}
document.getElementById("outline").onchange = updateOutline;
document.getElementById("outlineWidth").oninput = updateOutline;

function view(name) {
  const h = mesh ? new THREE.Box3().setFromObject(mesh).max.y : 20;
  const target = new THREE.Vector3(0, h * 0.55, 0);
  const d = h * 2.3;
  const pos = { front: [0, h * 0.55, d], side: [d, h * 0.55, 0], back: [0, h * 0.55, -d] }[name];
  if (name === "face") { target.set(0, h * 0.89, 0); camera.position.set(0, h * 0.89, h * 0.55); }
  else camera.position.set(...pos);
  controls.target.copy(target);
  controls.update();
}

const CACHE_BUST = Date.now();
function load(name) {
  if (mesh) scene.remove(mesh);
  physics = null;
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => url.startsWith("data:") || url.startsWith("blob:") ? url : `${url}${url.includes("?") ? "&" : "?"}v=${CACHE_BUST}`);
  new MMDLoader(manager).load(`../models/${name}/${Q.get("pmx") || name}.pmx`, async (m) => {
    mesh = m;
    // MMD 本体のテクスチャ付き材質は「テクスチャ × saturate(環境色 + 拡散色 × 光)」。
    // three.js は環境色をテクスチャの外に足す（MMDLoader は 0.2 倍で逃げる）ので、拡散色に寄せて同じ明るさにする
    m.material.forEach((mt) => {
      if (!mt.map) return;
      const amb = mt.emissive.clone().multiplyScalar(5);
      const c = mt.color.clone().multiplyScalar(LIGHT).add(amb);
      mt.color.setRGB(Math.min(1, c.r), Math.min(1, c.g), Math.min(1, c.b)).multiplyScalar(1 / LIGHT);
      mt.emissive.setRGB(0, 0, 0);
    });
    // notoon=1：トゥーン画像（MMD 本体付属の toon_*.bmp など）が手元にない既製モデルを真っ黒にしない
    if (Q.get("notoon")) m.material.forEach((mt) => { mt.gradientMap = null; mt.needsUpdate = true; });
    updateOutline();
    await ammoReady;
    const d = m.geometry.userData.MMD;
    if (d.rigidBodies.length) physics = new MMDPhysics(m, d.rigidBodies, d.constraints, { unitStep: 1 / 65, maxStepNum: 3 });
    window.physics = physics;
    scene.add(m);
    window.mesh = m;
    const box = document.getElementById("morphs");
    box.innerHTML = "";
    Object.entries(m.morphTargetDictionary).forEach(([k, i]) => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="range" min="0" max="1" step="0.01" value="0"> ${k}`;
      l.querySelector("input").oninput = (e) => { m.morphTargetInfluences[i] = +e.target.value; };
      box.appendChild(l);
    });
    rest = { center: bone("センター").position.clone(), h: new THREE.Box3().setFromObject(m).max.y };
    view("front");
    if (compare) setupCompare(name);
    else if (Q.get("cam") === "face") faceCam();
    if (motion && Q.get("at") !== null) seek(+Q.get("at"));
    // morph=まばたき:1,あ:0.5 のように開くと、その表情で写す
    (Q.get("morph") || "").split(",").filter(Boolean).forEach((kv) => {
      const [k, v] = kv.split(":"), i = m.morphTargetDictionary[k];
      if (i !== undefined) m.morphTargetInfluences[i] = +(v ?? 1);
    });
  }, undefined, (e) => console.error(e));
}

// 立ち絵に合わせて腕を下ろし、同じ大きさで写す
function setupCompare(name) {
  const el = document.getElementById("ref");
  const src = `../ref/${Q.get("img") || name + ".png"}`;
  el.style.backgroundImage = `url(${src})`;
  document.getElementById("physics").checked = false;
  const arms = +(Q.get("arms") ?? 0.62);
  bone("左腕").rotation.set(0, 0, -arms);
  bone("右腕").rotation.set(0, 0, arms);
  const h = new THREE.Box3().setFromObject(mesh).max.y;
  const fov = camera.fov * Math.PI / 180;
  if (compare === "face") {
    const [x0, y0, x1, y1] = (Q.get("fb") || "0.3,0,0.7,0.3").split(",").map(Number);
    const img = new Image();
    img.onload = () => {
      // 枠 (x0..x1, y0..y1) が左半分いっぱいになるよう拡大する
      const bw = (x1 - x0) * img.width, bh = (y1 - y0) * img.height;
      const k = Math.min(el.clientWidth / bw, el.clientHeight / bh);
      el.style.backgroundSize = `${img.width * k}px ${img.height * k}px`;
      el.style.backgroundPosition = `${el.clientWidth / 2 - (x0 + x1) / 2 * img.width * k}px ${el.clientHeight / 2 - (y0 + y1) / 2 * img.height * k}px`;
    };
    img.src = src;
    const span = +(Q.get("span") ?? 0.30);  // 写す高さ（身長比）
    const cy = h * +(Q.get("cy") ?? 0.88);
    controls.target.set(0, cy, 0);
    camera.position.set(0, cy, span * h / 2 / Math.tan(fov / 2));
  } else {
    controls.target.set(0, h * 0.5, 0);
    camera.position.set(0, h * 0.5, h * 0.53 / Math.tan(fov / 2));
  }
  // yaw=度 で見る向きを回す（90 で横顔、45 で斜め）。正面の比較だけでは横顔の崩れに気づけない
  const yaw = +(Q.get("yaw") ?? 0) * Math.PI / 180;
  const pitch = +(Q.get("pitch") ?? 0) * Math.PI / 180;
  const off = camera.position.clone().sub(controls.target);
  off.applyAxisAngle(new THREE.Vector3(1, 0, 0), -pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  camera.position.copy(controls.target).add(off);
  controls.update();
}

// ?cam=face：顔の大写し（調整ページの表示用）。yaw=度 で斜めから、ui=0 で操作パネルを隠す
function faceCam() {
  document.getElementById("physics").checked = false;
  const down = +(Q.get("armdown") ?? 0.62);  // 腕を下ろす角（0 で T ポーズのまま）
  bone("左腕").rotation.set(0, 0, -down);
  bone("右腕").rotation.set(0, 0, down);
  const h = new THREE.Box3().setFromObject(mesh).max.y;
  const fov = camera.fov * Math.PI / 180;
  const span = +(Q.get("span") ?? 0.17);  // 写す高さ（身長比）
  const spanW = +(Q.get("spanw") ?? 0.11);  // 写す幅（身長比）。縦長の枠でも顔の幅が入るようにする
  const cy = h * +(Q.get("cy") ?? 0.885);
  const t = Math.tan(fov / 2);
  // cx・cz（身長比）で見る中心を左右・前後にずらし、pitch（度）で上下から見る（手や足の細部用）
  const cx = h * +(Q.get("cx") ?? 0), cz = h * +(Q.get("cz") ?? 0);
  controls.target.set(cx, cy, cz);
  camera.position.set(cx, cy, cz + Math.max(span * h / 2 / t, spanW * h / 2 / (t * camera.aspect)));
  // hide=材質名,材質名 でその材質を隠す（顔にかかる小物など）
  const hide = (Q.get("hide") || "").split(",").filter(Boolean);
  mesh.material.forEach((mt) => { if (hide.includes(mt.name)) mt.visible = false; });
  const yaw = +(Q.get("yaw") ?? 0) * Math.PI / 180;
  const pitch = +(Q.get("pitch") ?? 0) * Math.PI / 180;
  const off = camera.position.clone().sub(controls.target);
  off.applyAxisAngle(new THREE.Vector3(1, 0, 0), -pitch).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  camera.position.copy(controls.target).add(off);
  controls.update();
}
if (Q.get("ui") === "0") document.getElementById("ui").style.display = "none";

function bone(n) { return mesh.skeleton.bones.find((b) => b.name === n); }

// ---- 動きの確認：歩く・走る・ジャンプ・ダンス（?motion=walk&at=秒 で、その瞬間で止めて写す）----
// 骨には向きがないので、回転軸はワールドの軸（three.js では前が +Z、左が +X）。
// 腕：Z で上げ下げ、X で前後（負で前）。ひじ：腕の向き×Z の軸で正が前へ曲がる。脚：X で前後（負で前）、ひざは正で後ろへ曲がる。
const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);
const ARM = 37 * Math.PI / 180;
let motion = Q.get("motion") || "", rest = null, frozen = false;
const ease = (x) => x * x * (3 - 2 * x), clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => ease(clamp((t - a) / (b - a), 0, 1));  // a..b で 0→1

function rot(n, ...steps) {  // steps = [[軸, 角], ...] を順に（先に書いたものが先に効く）
  const b = bone(n); if (!b) return;
  b.quaternion.identity();
  for (const [a, ang] of steps) b.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(a, ang));
}
function morph(n, v) {
  if (!mesh?.morphTargetDictionary) return;
  const i = mesh.morphTargetDictionary[n];
  if (i !== undefined) mesh.morphTargetInfluences[i] = clamp(v, 0, 1);
}
function resetMorphs() {
  if (mesh?.morphTargetInfluences) mesh.morphTargetInfluences.fill(0);
}

const armDir = (sd) => new THREE.Vector3(sd * Math.cos(ARM), -Math.sin(ARM), 0);
function arm(side, down, fwd, out = 0, bend = 0, shoulder = 0, wristTilt = 0, palmFwd = 0) {
  const sd = side === "左" ? 1 : -1;
  rot(side + "肩", [Z, -sd * shoulder]);
  rot(side + "腕", [Z, -sd * down], [X, -fwd], [Y, sd * out]);
  rot(side + "ひじ", [armDir(sd).cross(Z).normalize(), bend]);
  rot(side + "手首", [armDir(sd), -sd * palmFwd], [Z, sd * wristTilt]);
}
function poseHands(curlL = 0.35, curlR = 0.35, spread = 0.04) {
  const fingers = [
    ["人指", 0.85, 0.70, 0.45],
    ["中指", 1.00, 0.85, 0.55],
    ["薬指", 1.15, 0.95, 0.65],
    ["小指", 1.25, 1.05, 0.75],
  ];
  for (const [side, sd, curl] of [["左", 1, curlL], ["右", -1, curlR]]) {
    for (const [fn, m1, m2, m3] of fingers) {
      rot(side + fn + "１", [Z, -sd * curl * m1]);
      rot(side + fn + "２", [Z, -sd * curl * m2]);
      rot(side + fn + "３", [Z, -sd * curl * m3]);
    }
    rot(side + "親指０", [Y, sd * spread]);
    rot(side + "親指１", [Z, -sd * curl * 0.40], [Y, sd * 0.15]);
    rot(side + "親指２", [Z, -sd * curl * 0.45]);
  }
}
function leg(side, fwd, knee, ankle = 0, out = 0, rotY = 0) {
  const sd = side === "左" ? 1 : -1;
  rot(side + "足", [X, -fwd], [Z, sd * out], [Y, sd * rotY]);
  rot(side + "ひざ", [X, knee]);
  rot(side + "足首", [X, ankle]);
}
function center(dy, dx = 0, dz = 0) {
  const b = bone("センター"); if (!b || !rest) return;
  b.position.set(rest.center.x + dx * rest.h, rest.center.y + dy * rest.h, rest.center.z + dz * rest.h);
}
function resetExtraBones() {
  for (const n of ["全ての親", "グルーブ", "下半身", "上半身", "上半身2", "首", "頭", "両目", "左肩", "右肩", "左手首", "右手首"]) {
    const b = bone(n); if (b) b.quaternion.identity();
  }
  center(0);
}

function pose(t) {
  if (!mesh || !rest) return;
  resetExtraBones();
  resetMorphs();
  const s = Math.sin(t * 1.6);
  arm("左", 0.55 - 0.18 * s, 0.35 + 0.12 * s, 0.10, 0.85 + 0.35 * Math.max(0, s), 0, 0.15, 0.4);
  arm("右", 0.62, 0.25, 0, 0.55, 0, -0.1, 0.2);
  poseHands(0.40, 0.35);
  leg("左", 0.22 * Math.max(0, s), 0.55 * Math.max(0, s), -0.15 * Math.max(0, s), 0.04);
  leg("右", 0.10, 0.15, -0.05, 0.06);
  rot("下半身", [Y, -0.12 * s], [Z, 0.05 * s]);
  rot("上半身", [Y, 0.16 * s], [Z, -0.04 * s]);
  rot("上半身2", [Y, 0.08 * s]);
  rot("頭", [Z, 0.10 * s], [Y, 0.18 * s]);
  rot("両目", [Y, 0.25 * s]);
  morph("にこり", 0.55); morph("口角上げ", 0.35);
}

const MOTIONS = {
  walk(t) {
    resetExtraBones();
    resetMorphs();
    const p = t / 1.1 * 2 * Math.PI, sw = Math.sin(p), c = Math.cos(p);
    leg("左", 0.44 * sw, 0.08 + 0.72 * Math.max(0, c) ** 1.5, -0.10 * sw, 0.02);
    leg("右", -0.44 * sw, 0.08 + 0.72 * Math.max(0, -c) ** 1.5, 0.10 * sw, 0.02);
    arm("左", 0.78, -0.32 * sw, 0, 0.28 + 0.14 * Math.max(0, -sw), 0, 0.06, 0.25);
    arm("右", 0.78, 0.32 * sw, 0, 0.28 + 0.14 * Math.max(0, sw), 0, 0.06, 0.25);
    poseHands(0.45, 0.45);
    rot("上半身", [Y, 0.08 * sw]); rot("上半身2", [Y, 0.06 * sw]);
    rot("下半身", [Y, -0.10 * sw]);
    rot("頭", [Y, -0.05 * sw]);
    center(-0.020 + 0.010 * Math.abs(Math.sin(p)));
    morph("にこり", 0.30);
  },
  run(t) {
    resetExtraBones();
    resetMorphs();
    const p = t / 0.70 * 2 * Math.PI, sw = Math.sin(p), c = Math.cos(p);
    leg("左", 0.25 + 0.72 * sw, 0.35 + 1.50 * Math.max(0, c) ** 1.2, -0.25 * sw);
    leg("右", 0.25 - 0.72 * sw, 0.35 + 1.50 * Math.max(0, -c) ** 1.2, 0.25 * sw);
    arm("左", 0.68, -0.72 * sw, 0, 1.42, 0, 0, 0.35);
    arm("右", 0.68, 0.72 * sw, 0, 1.42, 0, 0, 0.35);
    poseHands(0.75, 0.75);
    rot("上半身", [X, 0.18], [Y, 0.16 * sw]); rot("上半身2", [Y, 0.08 * sw]);
    rot("下半身", [X, -0.06], [Y, -0.16 * sw]);
    rot("頭", [X, -0.10]);
    center(-0.032 + 0.028 * Math.abs(Math.sin(p)));
    morph("にこり", 0.35);
  },
  jump(t) {
    resetExtraBones();
    resetMorphs();
    t = t % 1.8;
    const crouch = seg(t, 0.0, 0.30) * (1 - seg(t, 0.30, 0.42)) + seg(t, 0.95, 1.08) * (1 - seg(t, 1.20, 1.50));
    const air = t > 0.38 && t < 1.00 ? Math.sin(Math.PI * (t - 0.38) / 0.62) : 0;
    const tuck = air * (t < 0.69 ? 1 : 0.6);
    for (const sd of ["左", "右"])
      leg(sd, 0.72 * crouch + 0.85 * tuck, 1.45 * crouch + 1.65 * tuck, -0.72 * crouch - 0.55 * tuck + 0.28 * air, 0.04 * air);
    const up = seg(t, 0.30, 0.50) * (1 - seg(t, 0.90, 1.15));
    for (const sd of ["左", "右"]) arm(sd, 0.76 - 1.25 * up - 0.18 * crouch, 0.25 * up - 0.55 * crouch, 0, 0.45 + 0.35 * up, -0.18 * up, 0.15 * up, 0.4 * up);
    poseHands(0.30, 0.30);
    rot("上半身", [X, 0.28 * crouch - 0.08 * air]);
    rot("頭", [X, -0.10 * air]);
    center(-0.18 * crouch - 0.10 * tuck + 0.26 * air);
    morph("笑い", 0.65 * air); morph("あ", 0.45 * air);
  },
  dance(t) {
    resetExtraBones();
    resetMorphs();
    t = t % 8.0;
    // スムーズで可愛い 8 秒アイドルダンス（各フレーズを滑らかにクロスフェードし、継ぎ目で止まったり肩・脚が破綻しない）
    const beat = 0.5 * (1.0 - Math.cos(t * 2.0 * Math.PI));  // 毎拍 0.5s の弾むリズム (0..1)
    const sway = Math.sin(t * Math.PI);                     // 1.0s 周期の柔らかな左右スウェイ (-1..+1)
    const half = Math.sin(t * 0.5 * Math.PI);
    const fade = (a, b, f = 0.42) => seg(t, a, a + f) * (1 - seg(t, b - f, b));
    // ループ境界 t=0 / t=8 付近も滑らかにつながる包絡線
    const p1 = Math.max(fade(0.0, 2.2), seg(t, 7.65, 8.0));
    const p2 = fade(1.85, 4.2);
    const p3 = fade(3.85, 6.2);
    const p4 = fade(5.85, 8.0);
    const spinT = clamp((t - 6.0) / 1.25, 0, 1);
    const spin = ease(spinT) * Math.PI * 2;                 // 7.25s で正面 0 rad に着地（巻き戻し無し）
    const finishPose = seg(t, 7.15, 7.45) * (1 - seg(t, 7.78, 8.0));

    // 各フレーズの目標腕パラメータを重み付きブレンド（肩の安全角・可愛い肘曲げ・手首の角度）
    const lArm = [0.68, 0.28, 0.05, 0.65, 0.0, 0.12, 0.45];
    const rArm = [0.68, 0.28, 0.05, 0.65, 0.0, 0.12, 0.45];
    const mix = (dst, src, w) => { for (let i = 0; i < dst.length; i++) dst[i] += (src[i] - dst[i]) * w; };

    // 1) ほっぺ・胸前フレーム＋首傾げポーズ
    mix(lArm, [0.46 - 0.08 * beat, 0.62, 0.28, 1.62 + 0.12 * beat, -0.05, 0.28 + 0.08 * sway, 0.55], p1);
    mix(rArm, [0.46 - 0.08 * beat, 0.62, 0.28, 1.62 - 0.12 * beat, -0.05, 0.28 - 0.08 * sway, 0.55], p1);

    // 2) 耳の高さで元気よく可愛くお手振り（交互）
    const wSide = seg(t, 2.85, 3.15);
    const waveOsc = 0.22 * Math.sin(t * 4.0 * Math.PI);
    mix(rArm, [-0.12 + 0.16 * wSide, 0.45, -0.10, 1.28 + waveOsc * (1 - wSide), -0.15 * (1 - wSide), 0.35 + waveOsc, 0.35], p2);
    mix(lArm, [0.68 - 0.80 * wSide, 0.32 + 0.15 * wSide, 0.05 - 0.15 * wSide, 0.80 + (0.48 + waveOsc) * wSide, -0.15 * wSide, 0.25 + 0.15 * wSide, 0.40], p2);

    // 3) 軽やかなリズミカル腕振り
    mix(lArm, [0.58 - 0.15 * beat, 0.38 + 0.35 * sway, 0.10, 1.05 + 0.30 * beat, -0.04, 0.18, 0.40], p3);
    mix(rArm, [0.58 - 0.15 * beat, 0.38 - 0.35 * sway, 0.10, 1.05 + 0.30 * beat, -0.04, 0.18, 0.40], p3);

    // 4) ふわりと優雅なターン〜フィニッシュポーズ
    const hopping = Math.sin(spinT * Math.PI);
    mix(lArm, [0.32, 0.36, -0.15, 0.85, -0.10, 0.25, 0.40], p4 * hopping);
    mix(rArm, [0.32, 0.36, -0.15, 0.85, -0.10, 0.25, 0.40], p4 * hopping);
    mix(lArm, [0.36, 0.68, 0.22, 1.72, -0.06, 0.32, 0.60], finishPose);
    mix(rArm, [0.66, 0.28, -0.10, 0.62, 0.0, 0.22, 0.35], finishPose);

    arm("左", ...lArm);
    arm("右", ...rArm);
    poseHands(0.32 + 0.25 * p1, 0.32 + 0.25 * p1, 0.08);

    // 脚：前に蹴り上げず、可愛いステップバウンス＆後ろ足ちょん跳ね（スカートでも破綻しない）
    const hopL = p3 * Math.max(0, Math.sin(t * Math.PI));
    const hopR = p3 * Math.max(0, -Math.sin(t * Math.PI));
    const lFwd = -0.12 * hopL + 0.12 * beat + 0.08 * p1 * Math.max(0, sway) + 0.06 * finishPose;
    const rFwd = -0.12 * hopR + 0.12 * beat + 0.08 * p1 * Math.max(0, -sway) - 0.16 * finishPose;
    const lKnee = 0.16 + 0.26 * beat + 0.92 * hopL + 0.18 * hopping + 0.15 * finishPose;
    const rKnee = 0.16 + 0.26 * beat + 0.92 * hopR + 0.18 * hopping + 0.65 * finishPose;
    const lAnk = -0.08 - 0.10 * beat + 0.22 * hopL + 0.18 * hopping;
    const rAnk = -0.08 - 0.10 * beat + 0.22 * hopR + 0.18 * hopping + 0.22 * finishPose;
    leg("左", lFwd, lKnee, lAnk, 0.05 + 0.08 * p3 * Math.max(0, -sway), -0.06 * sway);
    leg("右", rFwd, rKnee, rAnk, 0.05 + 0.08 * p3 * Math.max(0, sway) + 0.05 * finishPose, 0.06 * sway);

    // 柔らかな腰スウェイ・胸のカウンター・可愛い首傾げ
    const hipZ = 0.15 * sway * (1 - 0.5 * p4 * hopping) + 0.12 * finishPose;
    rot("下半身", [Z, hipZ], [Y, 0.11 * sway], [X, -0.04 * beat]);
    rot("上半身", [Z, -0.12 * sway], [X, 0.05 * beat], [Y, -0.08 * sway]);
    rot("上半身2", [Z, -0.08 * sway + 0.08 * finishPose], [X, 0.04 * (1 - beat)]);
    rot("首", [Z, 0.07 * sway], [X, -0.03 * beat]);
    rot("頭", [Z, 0.14 * sway + 0.18 * finishPose], [Y, -0.10 * half + 0.12 * finishPose], [X, -0.04 * beat + 0.05 * finishPose]);
    rot("両目", [Y, 0.16 * sway - 0.14 * finishPose]);
    rot("全ての親", [Y, spin]);

    const sideStep = (0.022 * sway * (p1 + p2) + 0.036 * sway * p3) * (1 - finishPose);
    center(-0.014 - 0.018 * beat + 0.042 * hopping - 0.012 * finishPose, sideStep, 0.008 * beat);

    // 明るいアイドル表情（にこり・口角上げ・歌う口・決めポーズのウィンク）
    morph("口角上げ", 0.50);
    morph("にこり", 0.65 * (1 - finishPose));
    morph("あ", 0.42 * p2 + 0.25 * beat * p3);
    morph("笑い", 0.35 * p4 * (1 - hopping));
    morph("ウィンク", finishPose);
  },
};
function setMotion(m) {
  motion = m; t = 0; frozen = false; posing = false;
  if (!mesh) return;
  mesh.skeleton.pose();
  resetMorphs();
  if (rest) center(0);
  if (physics) physics.reset();
}
// 0 秒から at 秒まで 1/60 刻みで動きと物理を進めて止める（スクリーンショットが毎回同じ形になる）
function seek(at) {
  setMotion(motion);
  for (let k = 0, n = Math.round(at * 60); k <= n; k++) {
    t = k / 60; MOTIONS[motion](t); mesh.updateMatrixWorld(true);
    if (physics && document.getElementById("physics").checked) physics.update(1 / 60);
  }
  frozen = true;
}
window.seek = seek; window.setMotion = setMotion;

document.querySelectorAll("[data-model]").forEach((b) => b.onclick = () => load(b.dataset.model));
document.getElementById("pose").onclick = () => { setMotion(""); posing = !posing; if (!posing) mesh.skeleton.pose(); };
document.querySelectorAll("[data-motion]").forEach((b) => b.onclick = () => setMotion(b.dataset.motion));
["front", "side", "back", "face"].forEach((n) => document.getElementById(n).onclick = () => view(n));
window.view = view; window.load = load; window.camera = camera; window.controls = controls; window.pose = pose; window.setPosing = (v) => posing = v;
window.render = () => effect.render(scene, camera); window.renderer = renderer;
// 確認用：sheet([[動き, 秒, 向き(度), 注視点の高さ(身長比)か骨の名前, 写す高さ(身長比), 見下ろし(度)], ...], 列, 隠す材質の正規表現)
// で、いくつもの瞬間・向きを 1 枚に並べて画面に重ねる（クリックで消える）
window.sheet = (cells, cols = 3, hide = null, cw = 400, ch = 400) => {
  const out = document.createElement("canvas");
  out.width = cw * cols; out.height = ch * Math.ceil(cells.length / cols);
  const g = out.getContext("2d");
  document.getElementById("sheet")?.remove();
  setMotion("");
  const h = rest.h;
  mesh.material.forEach((m) => m.visible = !(hide && hide.test(m.name)));
  cells.forEach(([mo, at, yaw, cy, span, pitch = 0], k) => {
    setMotion(mo); if (mo) seek(at);
    // 注視点は高さ（身長比）か、骨の名前（動いた後のその骨の位置）
    mesh.updateMatrixWorld(true);
    const tgt = typeof cy === "string" ? bone(cy).getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(0, h * cy, 0);
    const d = span * h / 2 / Math.tan(camera.fov * Math.PI / 360);
    const a = yaw * Math.PI / 180, p = pitch * Math.PI / 180;
    camera.position.set(tgt.x + d * Math.sin(a) * Math.cos(p), tgt.y + d * Math.sin(p), tgt.z + d * Math.cos(a) * Math.cos(p));
    controls.target.copy(tgt); controls.update();
    effect.render(scene, camera);
    const c = renderer.domElement, s = Math.min(c.width / cw, c.height / ch);
    const x = (k % cols) * cw, y = Math.floor(k / cols) * ch;
    g.drawImage(c, (c.width - cw * s) / 2, (c.height - ch * s) / 2, cw * s, ch * s, x, y, cw, ch);
    g.strokeStyle = "#999"; g.strokeRect(x, y, cw, ch);
    g.fillStyle = "#000"; g.font = "18px sans-serif"; g.fillText(`${mo} ${at}s ${yaw}°`, x + 6, y + 20);
  });
  mesh.material.forEach((m) => m.visible = true);
  const img = document.createElement("img"); img.id = "sheet"; img.onclick = () => img.remove();
  img.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#fff;z-index:99";
  img.src = out.toDataURL(); document.body.appendChild(img);
  return cells.length;
};

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!frozen) t += dt * (motion ? +document.getElementById("speed").value : 1);
  if (posing) pose(t);
  else if (motion && rest && !frozen) MOTIONS[motion](t);
  if (physics && !frozen && document.getElementById("physics").checked) { mesh.updateMatrixWorld(true); physics.update(dt); }
  effect.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = W() / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(W(), innerHeight);
});
load(new URLSearchParams(location.search).get("m") || "tabane_roze");
</script>
</body>
</html>
