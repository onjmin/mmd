name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

# 既定は読み取りだけ。書き込みが要る deploy ジョブだけ下で個別に足す
permissions:
  contents: read

jobs:
  # 1. ビルドジョブ：ビューアとモデルを集めてアップロードする
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # models/ はコミット済みの生成物をそのまま使う。ref/ は再配布しないので含めない
      - name: Collect site files
        run: |
          mkdir -p site
          cp index.html site/
          cp -r viewer site/viewer
          cp -r models site/models
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./site

  # 2. デプロイジョブ：ビルド完了後にPagesへデプロイする
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write # デプロイに必須
      id-token: write # OIDC認証に必須
    runs-on: ubuntu-latest
    needs: build # buildジョブが成功した後に実行する
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
